# Terragrunt CI for aws-org.
#
# - Pull requests only plan. No applies, no live changes.
# - Push to main applies, in order: org account, then the dev and prod member
#   accounts.
#
# The org job is inline rather than a call to fomiller/gh-actions because it
# runs as the org account's admin user with no role to assume, and the shared
# workflow always sets role-to-assume. Its creds come from the `org`
# environment.

name: 'Terragrunt Deploy'

on:
  pull_request:
    paths:
      - '.github/workflows/deploy.yml'
      - 'infra/**'
      - 'justfile'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy.yml'
      - 'infra/**'
      - 'justfile'

env:
  tf-version: latest
  tg-version: 0.42.8
  doppler-project: aws-org

jobs:
  Pre-check:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          cancel_others: 'true'
          concurrent_skipping: 'same_content_newer'

  Org:
    name: ${{ github.event_name == 'pull_request' && 'Plan Org' || 'Apply Org' }}
    needs: Pre-check
    if: ${{ needs.pre-check.outputs.should_skip != 'true' }}
    runs-on: ubuntu-latest
    environment: org

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Terraform ${{ env.tf-version }}
        uses: hashicorp/setup-Terraform@v2
        with:
          terraform_version: ${{ env.tf-version }}
          terraform_wrapper: false

      - name: Install Terragrunt ${{ env.tg-version }}
        run: |
          sudo wget -q -O /bin/terragrunt "https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.tg-version }}/terragrunt_linux_amd64"
          sudo chmod +x /bin/terragrunt

      - name: Install Just
        uses: extractions/setup-just@v1

      - name: Install Doppler
        uses: dopplerhq/cli-action@v2

      - name: Doppler Setup
        run: doppler setup -p ${{ env.doppler-project }} -c org
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ADMIN_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.ADMIN_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
          role-duration-seconds: 1200

      - name: Terragrunt Plan
        if: ${{ github.event_name == 'pull_request' }}
        run: just infraDir=infra/modules/aws/org plan-all

      - name: Terragrunt Apply
        if: ${{ github.event_name == 'push' }}
        run: just infraDir=infra/modules/aws/org apply-all

  Member-dev:
    name: ${{ github.event_name == 'pull_request' && 'Plan Member (dev)' || 'Apply Member (dev)' }}
    needs: Org
    uses: fomiller/gh-actions/.github/workflows/terragrunt.yaml@main
    with:
      environment: dev
      infra-dir: infra/modules/aws/member
      doppler-project: aws-org
      tg-version: 0.42.8
      tg-plan: ${{ github.event_name == 'pull_request' }}
      role-skip-session-tagging: true
    secrets: inherit

  Member-prod:
    name: ${{ github.event_name == 'pull_request' && 'Plan Member (prod)' || 'Apply Member (prod)' }}
    needs: Member-dev
    uses: fomiller/gh-actions/.github/workflows/terragrunt.yaml@main
    with:
      environment: prod
      infra-dir: infra/modules/aws/member
      doppler-project: aws-org
      tg-version: 0.42.8
      tg-plan: ${{ github.event_name == 'pull_request' }}
      role-skip-session-tagging: true
    secrets: inherit
